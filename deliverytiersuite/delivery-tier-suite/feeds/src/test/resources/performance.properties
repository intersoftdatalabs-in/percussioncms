# Performance test configuration - Updated for comprehensive testing
benchmark.warmup.iterations=5
benchmark.test.iterations=10
benchmark.concurrent.users=10
benchmark.timeout.seconds=30
benchmark.max-operations=1000

# Load test thresholds
loadtest.ramp-up-seconds=30
loadtest.steady-state-minutes=5
loadtest.cool-down-seconds=30
loadtest.max-concurrent-users=50
loadtest.target-throughput=100
loadtest.error-rate-threshold=0.01
loadtest.min-duration-seconds=30

# Feed processing limits
feed.max-items=1000
feed.batch-size=100
feed.max-content-length=50000
feed.max-retries=3

# Performance thresholds
performance.threshold.response-time-ms=500
performance.threshold.memory-mb=256
performance.threshold.cpu-percent=80
performance.threshold.gc-overhead=0.1

# XML processing settings
xml.validation.enabled=true
xml.format.indent=true
xml.format.normalize=true
xml.security.external-entities=false
xml.cache.schema=true
xml.cache.size=100
xml.parser.pool-size=10

# Monitoring settings
monitoring.jmx.enabled=true
monitoring.metrics.interval-seconds=15
monitoring.alert.threshold-violations=3
monitoring.report.format=json
