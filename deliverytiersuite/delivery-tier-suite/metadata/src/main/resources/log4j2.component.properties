# Log4j2 component properties loaded very early (before full XML configuration in many bootstrap scenarios).
# This is the most effective way to control StatusLogger output, which is what emits the
# "Ignoring call to `j.u.l.Logger.setUseParentHandlers(true)`" warnings from the log4j-jul bridge.
#
# These warnings are triggered when third-party libraries (Liquibase, Spring, Hibernate, Tomcat internals, etc.)
# call setUseParentHandlers(true) on java.util.logging.Loggers. The Log4j JUL bridge cannot fully support
# this mutation, so it emits a warning via StatusLogger.
#
# Setting the status level to ERROR here suppresses the noise during early webapp initialization
# (including during WAR deployment before the Spring context or the main log4j2.xml is active).
log4j2.statusLoggerLevel=ERROR

# Specifically silence the "Ignoring call to j.u.l.Logger.setUseParentHandlers(true)" messages
# emitted by the Log4j JUL bridge. These can still appear very early (before the XML config
# is fully active) even with statusLoggerLevel=ERROR.
org.apache.logging.log4j.jul.Log4jLogger.level=OFF
