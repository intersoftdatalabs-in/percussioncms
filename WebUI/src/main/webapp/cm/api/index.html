<html lang="en">
<head>
    <meta charset="utf-8" />
    <!--
      Legacy Swagger-UI 2.x API-doc viewer retired (#5672 / parent #5627).
      The vendored swagger-era libraries (handlebars-1.0.0, backbone,
      underscore, highlight, shred, swagger.js, swagger-oauth, jquery copies)
      are removed. Interactive API exploration moved to the /openapi webapp.
      Preserve bookmarks with an instant client-side redirect.
    -->
    <meta http-equiv="refresh" content="0;url=/openapi/" />
    <link rel="canonical" href="/openapi/" />
    <title>API documentation moved</title>
</head>
<body>
<p>API documentation has moved to the OpenAPI viewer.
    <a href="/openapi/">Continue to /openapi/</a>.</p>
</body>
</html>
