version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    target-branch: "development-8.1.x"
    # ignore known groups/artifacts that require > Java 1.8.0+
    ignore:
      - dependency-name: "org.apache.cxf:*"
        versions:
          - ">=3.6"
      - dependency-name: "org.basepom.maven:duplicate-finder-maven-plugin"
        versions:
          - ">=2"
      - dependency-name: "org.quartz-scheduler:quartz"
        versions:
          - ">=2.5"
      - dependency-name: "org.springframework:*"
        versions:
          - ">=6"
      - dependency-name: "org.apache.tika:*"
        versions:
          - ">=3"
      - dependency-name: "org.junit.jupiter:*"
        versions:
          - ">=6"
      - dependency-name: "org.apache.activemq:*"
        versions:
          - ">=5.17"
      - dependency-name: "org.jboss.logging:jboss-logging"
        versions:
          - ">=3.5"
      - dependency-name: "org.apache.derby:*"
        versions:
          - ">=10.15"
      - dependency-name: "org.aspectj:*"
        versions:
          - ">=1.9.8"
      - dependency-name: "org.apache.myfaces.core:*"
        versions:
          - ">=4"
      - dependency-name: "org.apache.felix:maven-bundle-plugin"
        versions:
          - ">=6"
      - dependency-name: "org.apache.jackrabbit:jackrabbit-jcr-commons"
        versions:
          - ">=2.22"
      - dependency-name: "com.diffplug.spotless:spotless-maven-plugin"
        versions:
          - ">=2.31"
      - dependency-name: "org.liquibase:*"
        versions:
          - ">=5"
      - dependency-name: "org.apache.tomcat:*"
        versions:
          - ">=10"
      - dependency-name: "org.eclipse.jetty:*"
        versions:
          - ">=10"
      - dependency-name: "com.zaxxer:HikariCP"
        versions:
          - ">=5"
      - dependency-name: "org.apache.maven.plugins:maven-deploy-plugin"
        versions:
          - ">=4"
      - dependency-name: "org.springframework.data:spring-data-jpa"
        versions:
          - ">=2.8"
      - dependency-name: "org.springframework.security:*"
        versions:
          - ">=5.9"
      - dependency-name: "org.mozilla:rhino"
        versions:
          - ">=1.8"
      - dependency-name: "com.lmax:disruptor"
        versions:
          - ">=4"
      - dependency-name: "org.jmock:*"
        versions:
          - ">=2.9"
      - dependency-name: "com.percussion:*"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "development"
    ignore:
      - dependency-name: "jakarta.inject:jakarta.inject-api"
        versions:
          - ">=2"
      - dependency-name: "com.percussion:*"
