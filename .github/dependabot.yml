version: 2
updates:
  # Active product line: Java 21 / main
  # (Java 8 maintenance line moved to intersoftdatalabs-in/percussioncms-java8)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "main"
    ignore:
      - dependency-name: "jakarta.inject:jakarta.inject-api"
        versions:
          - ">=2"
      - dependency-name: "com.percussion:*"
        versions: [">= 0"]
      # After intentional SolrJ 10.x landing (#1788 / #2009): freeze major-only
      # Dependabot bumps so the next Solr major cannot reappear as a version-only
      # PR (see closed #1777). Patch/minor within 10.x remain allowed.
      - dependency-name: "org.apache.solr:*"
        update-types:
          - "version-update:semver-major"

  # npm / frontend packages (lockfiles present). Dual WebUI roots stay in lockstep:
  # WebUI/package.json and WebUI/src/main/frontend (Maven frontend-maven-plugin).
  # Skip WebUI/vendor/mkd-language (local file: package, no lockfile).
  - package-ecosystem: "npm"
    directories:
      - "/WebUI"
      - "/WebUI/src/main/frontend"
      - "/modules/perc-common-ui-bundle"
      - "/modules/perc-qa-automation/frontend"
      - "/modules/perc-tinymce"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "main"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
