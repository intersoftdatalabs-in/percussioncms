# CodeQL Advanced — analyzer of record for this repository.
#
# Default CodeQL setup is intentionally disabled (state=not-configured).
# All PR and branch analysis must go through this workflow so that:
#   - .github/codeql/codeql-config.yml (paths-ignore, query-filters) applies
#   - .github/codeql/models (custom sanitizer barriers) applies
#
# See docs/ai-generated/tasks/gh-codeql-alerts/codeql-pr-playbook.md
#
name: "CodeQL Advanced"

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
  schedule:
    - cron: "44 2 * * 4"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

      # required so PR checks / annotations can be written for the head SHA
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: none # This mode only analyzes Java. Set this to 'autobuild' or 'manual' to analyze Kotlin too.
          - language: javascript-typescript
            build-mode: none
        # CodeQL supports: 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin',
        # 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          # config-file packs: loads ./.github/codeql/models (URLValidation,
          # escapeLdapFilter, path guards, secured XML helpers as barriers).

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
