name: signed-commits

# Gate for #6855 — run scripts/verify-signed-commits.py (#6809, via #6854) in CI
# on every PR so unsigned / unattributed commits fail fast with the gate's
# actionable remediation output before human review.
#
# Design notes (why it looks like this):
# - Trigger is `pull_request` with NO `paths:` filter on purpose. The gate
#   inspects commits, not files: a path-filtered trigger would let an
#   unsigned commit slip through on any PR that only touches other paths —
#   exactly the #6769/#6770 defect class this gate exists to catch.
# - `fetch-depth: 0` on checkout is REQUIRED: `git log <base>..<head>` cannot
#   resolve the range on the default depth-1 clone.
# - The live `check` step is ADVISORY (`continue-on-error: true`) by design:
#   CI runners carry no signer keyrings (maintainer GPG / GitHub web keys),
#   so signature statuses cannot verify to `G` in CI the way they do on a
#   developer machine; the `required_signatures` branch ruleset remains the
#   merge blocker. Advisory-first is per the #6855 acceptance. The step still
#   concludes `failure` (red) on violations so the remediation output is
#   visible pre-review; placeholder-identity rows are deterministic and
#   keyring-independent, so they fail fast and loud either way.
# - The gate self-tests step is HARD (no continue-on-error): the pytest suite
#   proves both directions deterministically (unsigned/placeholder FAIL,
#   attributed PASS) on every PR, independent of CI keyring state.
# - No secrets: `permissions: contents: read` only; the gate is stdlib git +
#   python, no tokens, no key distribution.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-commits:
    name: signed-commits (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout (full history for base..head range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install test dependencies
        shell: bash
        run: python -m pip install -r scripts/requirements-dev.txt

      - name: Gate self-tests (unsigned/placeholder FAIL, attributed PASS)
        shell: bash
        run: python -m pytest scripts/test_verify_signed_commits.py scripts/test_signed_commits_workflow.py -q

      - name: Live PR check (advisory — remediation output before human review)
        continue-on-error: true
        shell: bash
        run: python scripts/verify-signed-commits.py check --base "origin/${{ github.base_ref }}"
