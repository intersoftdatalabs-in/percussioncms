# Models PSSecureXMLUtils secured factory/source helpers as XXE barriers.
# Runtime: getSecuredSaxSource / getSecuredSaxParserFactory disable doctype and
# external-entity features (alert #1710 / T039 residual).
extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: barrierModel
    data:
      - [
          "com.percussion.security.xml",
          "PSSecureXMLUtils",
          false,
          "getSecuredSaxSource",
          "(InputStream)",
          "",
          "ReturnValue",
          "xxe",
          "manual",
        ]
      - [
          "com.percussion.security.xml",
          "PSSecureXMLUtils",
          false,
          "getSecuredSaxSource",
          "(InputStream,PSXmlSecurityOptions)",
          "",
          "ReturnValue",
          "xxe",
          "manual",
        ]
      - [
          "com.percussion.security.xml",
          "PSSecureXMLUtils",
          false,
          "getSecuredSaxParserFactory",
          "(PSXmlSecurityOptions)",
          "",
          "ReturnValue",
          "xxe",
          "manual",
        ]
      - [
          "com.percussion.security.xml",
          "PSSecureXMLUtils",
          false,
          "getSecuredSaxParserFactory",
          "(String,ClassLoader,PSXmlSecurityOptions)",
          "",
          "ReturnValue",
          "xxe",
          "manual",
        ]
