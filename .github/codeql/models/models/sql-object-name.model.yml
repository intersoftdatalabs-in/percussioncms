# Models SecureStringUtils SQL barriers (T042 / java/sql-injection).
# Pack must load via "+./.github/codeql/models" (bare "./" is ignored).
extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: barrierModel
    data:
      - [
          "com.percussion.security",
          "SecureStringUtils",
          false,
          "requireSqlObjectName",
          "(String)",
          "",
          "ReturnValue",
          "sql-injection",
          "manual",
        ]
      - [
          "com.percussion.security",
          "SecureStringUtils",
          false,
          "requireSqlObjectNameOrNull",
          "(String)",
          "",
          "ReturnValue",
          "sql-injection",
          "manual",
        ]
      - [
          "com.percussion.security",
          "SecureStringUtils",
          false,
          "requireSafeMetadataToken",
          "(String)",
          "",
          "ReturnValue",
          "sql-injection",
          "manual",
        ]
      - [
          "com.percussion.security",
          "SecureStringUtils",
          false,
          "requireSingleSqlStatement",
          "(String)",
          "",
          "ReturnValue",
          "sql-injection",
          "manual",
        ]
      - [
          "com.percussion.security",
          "SecureStringUtils",
          false,
          "requireFactorySqlStatement",
          "(String)",
          "",
          "ReturnValue",
          "sql-injection",
          "manual",
        ]
