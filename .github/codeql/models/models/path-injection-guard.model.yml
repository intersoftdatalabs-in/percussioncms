# Models PSPathInjectionGuard helpers as path-injection barriers (T043 family).
# Runtime: requireSafeFileName rejects separators/NUL/..; requireUnderBase /
# requireUnderBasePath resolve and check the path stays under the base directory.
# Both File and Path overloads must be modeled — call sites commonly use
# requireUnderBase(File,String) which returns File (e.g. PSCSSParser #1755-#1757).
extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: barrierModel
    data:
      - [
          "com.percussion.security.io",
          "PSPathInjectionGuard",
          false,
          "requireSafeFileName",
          "(String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      - [
          "com.percussion.security.io",
          "PSPathInjectionGuard",
          false,
          "requireUnderBase",
          "(File,String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      - [
          "com.percussion.security.io",
          "PSPathInjectionGuard",
          false,
          "requireUnderBase",
          "(String,String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      - [
          "com.percussion.security.io",
          "PSPathInjectionGuard",
          false,
          "requireUnderBasePath",
          "(File,String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Virtual Site build outputRoot: requireSafeOutputRoot rejects empty / '.' / remaining '..'
      # after normalize (PSVirtualSiteHelper.isSafeRootPath). Used by SitesAdaptor.buildVirtualSite.
      - [
          "com.percussion.apibridge",
          "SitesAdaptor",
          false,
          "requireSafeOutputRoot",
          "(java.nio.file.Path)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Offline build service: same isSafeRootPath barrier for outputRoot / asset dest.
      # CodeQL #1956–#1960 / #1966 / residual thrash #1973–#1976.
      - [
          "com.percussion.services.virtualsite",
          "PSVirtualSiteBuildService",
          false,
          "requireSafeBuildRoot",
          "(java.nio.file.Path)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Href resolution under barrier-checked root (rejects .. / NUL / absolute).
      - [
          "com.percussion.services.virtualsite",
          "PSVirtualSiteBuildService",
          false,
          "resolveHref",
          "(java.nio.file.Path,String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Asset relative resolve under barrier-checked dest.
      - [
          "com.percussion.services.virtualsite",
          "PSVirtualSiteBuildService",
          false,
          "resolveUnder",
          "(java.nio.file.Path,java.nio.file.Path)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Durable participant store directory barrier. CodeQL #1962–#1965 / thrash #1969–#1972.
      - [
          "com.percussion.services.virtualsite",
          "PSInMemoryVirtualParticipantService",
          false,
          "requireSafeStoreDirectory",
          "(java.nio.file.Path)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Single-segment siteKey sanitizer for participants-*.jsonl file names.
      - [
          "com.percussion.services.virtualsite",
          "PSInMemoryVirtualParticipantService",
          false,
          "sanitize",
          "(String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # XML JDBC catalog physical path (CodeQL #1985–#1987). Runtime
      # requireUnderBase when the virtual root exists; normalize+startsWith
      # when the app root is not on disk yet.
      - [
          "com.percussion.data.vfs",
          "PSVirtualApplicationDirectory",
          false,
          "resolveUnderAppRoot",
          "(File,File)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      - [
          "com.percussion.data.vfs",
          "PSVirtualApplicationDirectory",
          false,
          "getPhysicalPath",
          "(File)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      - [
          "com.percussion.data.jdbc",
          "PSFileSystemDriver",
          false,
          "getPhysicalPath",
          "(String,com.percussion.server.PSUserSession,int)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Object-store app root / RecoverableFile (CodeQL #2001 / #1988–#2000).
      - [
          "com.percussion.design.objectstore.server",
          "PSServerXmlObjectStore",
          false,
          "getAppRootDir",
          "(String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      # Object-store application XML + lock-stream files (CodeQL #2002/#1920/#1921).
      - [
          "com.percussion.design.objectstore.server",
          "PSXmlObjectStoreHandler",
          false,
          "resolveApplicationXmlFile",
          "(File,String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      - [
          "com.percussion.design.objectstore.server",
          "PSXmlObjectStoreHandler",
          false,
          "requireUnderRxDir",
          "(File)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
      - [
          "com.percussion.design.objectstore.server",
          "PSXmlObjectStoreHandler",
          false,
          "getApplicationFile",
          "(String)",
          "",
          "ReturnValue",
          "path-injection",
          "manual",
        ]
