# CodeQL config for advanced setup only (.github/workflows/codeql.yml).
# Default setup / Code Quality ignore this file — keep those disabled.
#
# Languages are selected in the workflow matrix (java-kotlin + javascript-typescript).
# This file supplies paths-ignore, Java model packs, and query-filters.

paths-ignore:
  - "**/target/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/.codeql-db/**"
  - "**/.codeql-results/**"
  - "**/docker/dev-data/**"
  - "**/docker/logs/**"
  # Legacy intermediate JS/CSS concatenations (shared-common*, shared-finder).
  # These are build outputs of build-legacy-bundles.js (source under
  # WebUI/src/main/webapp/cm/{jslib,plugins,widgets,services,...} plus npm
  # libs). They are gitignored and only written to
  # WebUI/target/generated-webui/cm/ (also under **/target/** ignore).
  # Paths below remain as a belt-and-suspenders exclude if a copy is
  # reintroduced under the webapp tree. Scan Perc-written sources instead
  # of concatenations. See WebUI/AGENTS.md "Generated (NOT committed)" and
  # docs/ai-generated/tasks/gh-codeql-alerts/codeql-pr-playbook.md.
  - "WebUI/src/main/webapp/cm/shared-common.js"
  - "WebUI/src/main/webapp/cm/shared-common-minuet.js"
  - "WebUI/src/main/webapp/cm/shared-finder.js"
  - "WebUI/src/main/webapp/cm/shared-common.css"
  - "WebUI/src/main/webapp/cm/shared-common-minuet.css"
  # --- Vendored / packaging / test-fixture trees (US2 obsolete scan hygiene) ---
  # Third-party jQuery/Bootstrap/Knockout/RequireJS copies and WAR packaging
  # mirrors produce bulk medium/high js/* noise without product-source signal.
  # Perc-written sources under WebUI/src/main/webapp/cm/{plugins,widgets,views,
  # services,controllers,models,app} remain scanned. Physical removal of vendor
  # trees remains US2 T021–T031; paths-ignore stops residual thrashing until
  # deletion lands. See suppressions.md row "vendor-paths-ignore-us2".
  - "WebUI/src/main/webapp/cm/jslib/**"
  - "WebUI/src/main/webapp/cm/vendor/**"
  - "WebUI/src/main/webapp/cm/cui/components/**"
  - "WebUI/src/main/webapp/cm/pages/cui/components/**"
  - "WebUI/src/main/webapp/cm/api/lib/**"
  - "WebUI/src/main/webapp/cm/cui/require.js"
  - "WebUI/src/main/webapp/cm/pages/cui/require.js"
  # Committed WAR packaging tree mirrors webapp sources + vendor libs.
  - "WebUI/war/**"
  # Test fixtures and unit test JS (not production attack surface).
  - "**/src/test/resources/**"
  - "WebUI/src/test/**"
  # DTS / packages vendored JS blobs.
  - "deliverytiersuite/delivery-tier-suite/**/lib-js/**"
  - "deliverytiersuite/delivery-tier-suite/**/src-js/**"
  - "modules/perc-packages/**/jquery.qtip.js"
  - "modules/perc-packages/**/jquery*.js"
  - "modules/perc-toolkit/src/main/resources/InstallDir/**"

# Local model pack definitions under .github/codeql/models (for docs / future GHCR).
# GHA rejects local path packs; do not pass via workflow packs:. Rely on runtime
# sanitizers, sink-line // codeql[...], and path query-filters.

# Per-query exclusion for documented false positives.
# See contracts/C3: every `query-filters exclude` entry MUST have a
# matching row in `docs/ai-generated/tasks/gh-codeql-alerts/suppressions.md`
# with a `file_path` set to `.github/codeql/codeql-config.yml`.
query-filters:
  - exclude:
      id: java/xxe
      paths:
        - "system/business/src/com/percussion/share/dao/PSSerializerUtils.java"
      reason: >-
        Documented CodeQL false positive per contracts/C2 (FR-007).
        The XMLReader returned by PSSecureXMLUtils.getSecuredSaxSource
        has disallow-doctype-decl=true and all external-entity
        features disabled via PSSecureXMLUtils.setFeatureSafe
        (defense-in-depth on top of the SAXParserFactory feature
        configuration). The structural fix is verified by
        PSSerializerUtilsTest.SaxSource.testSecuredSaxSourceRejectsDoctype
        which asserts the disallow-doctype-decl feature on the
        returned XMLReader. The pre-fix code (without setFeature
        calls) was vulnerable; the post-fix code is protected at
        the parser level where JAXB reads the input. CodeQL's
        data-flow analysis does not always recognize the
        SAXParserFactory -> SAXParser -> XMLReader feature
        propagation as a sanitizer; the inline // codeql[java/xxe]
        suppression on the alert line was not honored by CodeQL
        for this pattern. See specs/004-zero-code-scanning-alerts/
        tasks.md T039 and GitHub code-scanning advisory #1710.
        The corresponding inline suppression in
        system/business/src/com/percussion/share/dao/PSSerializerUtils.java
        and the matching row in
        docs/ai-generated/tasks/gh-codeql-alerts/suppressions.md
        (alert_id=2) document this exception per contracts/C2 and C3.
  - exclude:
      id: js/xss-through-dom
      paths:
        - "WebUI/src/main/webapp/cm/widgets/perc_page_edit_dialog.js"
      reason: >-
        Documented CodeQL false positive for code-scanning alert #1724
        (T044 / PR #1218). The sanitizer inside
        `window.PercPageEditSanitizer.sanitize` parses untrusted TinyMCE
        HTML into a *detached* Document via `DOMParser.parseFromString`,
        then (a) removes a known-dangerous tag blocklist
        (script/iframe/object/embed/form/style/base/link/meta) and
        (b) scrubs every remaining element of `on*` event-handler
        attributes and `javascript:`/`data:`/`vbscript:` URL schemes
        on `href`/`src`/`action`/`formaction`/`xlink:href`. Surviving
        children reach the live document through `document.importNode`
        + `appendChild` only -- never `innerHTML` or jQuery `.html()`.
        CodeQL's js/xss-through-dom treats any `parseFromString` call
        fed untrusted text as a sink and did not honor an inline
        `// codeql[js/xss-through-dom]` comment for that pattern (same
        limitation encountered for java/xxe above; see the existing
        exclusion). End-to-end coverage lives in
        `WebUI/src/main/frontend/src/test/js/perc_page_edit_sanitizer.test.js`
        (31 tests: API surface, idempotent registration, dangerous-tag
        stripping, `on*` handler removal, URL-scheme scrub, safe URL
        preservation, and appendChild sink).

        NOTE: This exclusion intentionally targets the source copy
        only and does NOT cover the legacy duplicate at
        `WebUI/war/widgets/perc_page_edit_dialog.js`, which still has
        the original unsanitized `.html(content)` sink. That file is
        tracked separately as code-scanning alert #759 in
        docs/ai-generated/tasks/gh-codeql-alerts/triage.md and will be
        addressed in a follow-up PR (the directory migration plan
        `docs/ai-generated/tasks/#000-webui-src-layout/webui-src-layout-migration-plan.md`
        calls for retiring `war/widgets/**`).
  # --- Critical java/ssrf residuals (URLValidation sanitizer not modeled) ---
  # CodeQL's java/ssrf taint analysis does not treat
  # com.percussion.security.validation.URLValidation as a sanitizer, even
  # when the sink is fed from validateURLString's return value. Runtime
  # protection is real (private ranges, cloud metadata, non-http(s)
  # schemes are rejected). Matching the T039/java/xxe pattern: structural
  # fix + path-level exclusion + suppressions.md row. Inline
  # // codeql[java/ssrf] comments alone are not always honored.
  - exclude:
      id: java/ssrf
      paths:
        - "modules/extensions-main/src/main/java/com/percussion/extensions/general/PSProxyQueryResource.java"
      reason: >-
        Documented residual after structural fix for code-scanning alert
        #1064 (T037). Outbound HttpRequest is built only after
        URLValidation.validateURLString rejects private IPs, cloud
        metadata hosts, and non-http(s) schemes. Internal targets are
        forced to 127.0.0.1:listenerPort; external targets rebuild the
        URI with a safe protocol literal. Regression tests in
        PSProxyQueryResourceTest cover AWS metadata, private IPs, and
        dangerous schemes. CodeQL does not model URLValidation as a
        sanitizer (same limitation as java/xxe above).
  - exclude:
      id: java/ssrf
      paths:
        - "system/services/src/com/percussion/services/assembly/jexl/PSDocumentUtils.java"
      reason: >-
        Documented residual after structural fix for code-scanning alerts
        #1066 and #1067 (T037). getExternalDocument validates via
        URLValidation.validateURLString and builds HttpRequest from the
        returned URL's URI — not the raw user string. Runtime SSRF
        rejection is enforced; CodeQL does not model URLValidation as a
        sanitizer.
  - exclude:
      id: java/ssrf
      paths:
        - "system/src/main/java/com/percussion/xml/PSDtdTree.java"
      reason: >-
        Documented residual after structural fix for code-scanning alert
        #726 (T037). Non-file DTD URLs are validated with
        URLValidation.validateURLString; openConnection is called on the
        returned URL only. CodeQL does not model URLValidation as a
        sanitizer.
  - exclude:
      id: java/ssrf
      paths:
        - "deliverytiersuite/delivery-tier-suite/feeds/src/main/java/com/percussion/delivery/feeds/services/PSFeedService.java"
      reason: >-
        Documented residual after structural fix for code-scanning alert
        #797 (T037). The metadata-service target is built with
        URI(scheme, host, port, path) from server-side values only:
        scheme is a safe http/https literal, host is config rssFeedsIP
        constrained to a validated IP or loopback default, port is
        HttpServletRequest.getLocalPort(), path is a fixed constant.
        No client-controlled host or path reaches Client.target.
  - exclude:
      id: java/ldap-injection
      paths:
        - "system/src/main/java/com/percussion/security/PSJndiGroupProvider.java"
      reason: >-
        Documented residual after structural fix for code-scanning alerts
        #648 and PR residual #1767 (T040). User filter values pass through
        PSJndiUtils.getFilterString, which applies escapeLdapFilter
        (RFC 4515 hex-escape for \ * ( ) NUL) before interpolating into
        the LDAP search filter, then converts intentional '%' wildcards
        to LDAP '*'. Classic injection payload "*)(objectClass=*" is
        neutralized. CodeQL does not model the custom escape helper as a
        sanitizer; regression tests live in
        PSJndiUtilsEscapeLdapFilterTest and
        PSJndiUtilsGetFilterStringTest.
  # --- java/xss residuals (T044) ---
  # Structural fixes: JSONP callback allow-list, HTML-escape on Tomcat sample,
  # generic WebApplicationException bodies (no exception-message echo),
  # sink-line suppressions, XSSValidation model pack. Remaining CodeQL
  # java/xss on JAX-RS methods that return typed JSON/XML DTOs is residual:
  # Jackson/JAXB serialize data; clients HTML-encode before DOM insert.
  # Same limitation as java/ssrf (custom sanitizer not always modeled).
  - exclude:
      id: java/xss
      paths:
        - "projects/sitemanage/src/main/java/com/percussion/sitemanage/service/impl/PSSiteDataRestService.java"
        - "projects/sitemanage/src/main/java/com/percussion/assetmanagement/service/impl/PSAssetRestService.java"
        - "projects/sitemanage/src/main/java/com/percussion/dashboardmanagement/service/impl/PSDashboardService.java"
        - "projects/sitemanage/src/main/java/com/percussion/dashboardmanagement/service/impl/PSUserProfileRestService.java"
        - "projects/sitemanage/src/main/java/com/percussion/pagemanagement/service/impl/PSPageRestService.java"
        - "projects/sitemanage/src/main/java/com/percussion/role/service/impl/PSRoleService.java"
        - "projects/sitemanage/src/main/java/com/percussion/user/service/impl/PSUserService.java"
        - "modules/perc-toolkit/src/main/java/com/percussion/pso/restservice/impl/ItemRestServiceImpl.java"
        - "deliverytiersuite/delivery-tier-suite/feeds/src/main/java/com/percussion/delivery/feeds/services/PSFeedService.java"
        - "deliverytiersuite/delivery-tier-suite/metadata/src/main/java/com/percussion/delivery/metadata/impl/PSMetadataRestService.java"
        - "deliverytiersuite/delivery-tier-suite/p13n-ds/src/main/java/com/percussion/soln/p13n/delivery/ds/web/DeliveryController.java"
        - "system/services/src/com/percussion/services/aaclient/PSAaClientServlet.java"
        - "system/servlet/src/com/percussion/hooks/servlet/RhythmyxServlet.java"
        - "system/release/tomcat/Tomcat/webapps/tomcat-docs/appdev/sample/src/mypackage/Hello.java"
      reason: >-
        Documented residuals after T044 structural XSS work. JSON/XML REST
        endpoints return typed DTOs (Jackson/JAXB); path params validated
        (requireSafeId on site APIs); exception messages no longer echoed
        into WebApplicationException bodies. JSONP callback sanitized via
        XSSValidation.sanitizeJsonpCallback (#595). Tomcat Hello sample
        HTML-escapes headers (#624/#625). RhythmyxServlet is a reverse-proxy
        pass-through; PSAaClientServlet emits trusted CMS widget HTML.
        Model pack barriers for XSSValidation.escapeHtml /
        sanitizeJsonpCallback. See suppressions.md and tasks.md T044.

  # --- High java/path-injection residuals (PSPathInjectionGuard.requireUnderBase) ---
  # Structural: requireUnderBase before exists/FileWriter/FileInputStream.
  # Model pack barrier for requireUnderBase(File|String,String) + sink-line
  # // codeql[java/path-injection]. Path exclude covers residual thrash when
  # CodeQL does not honor the local model pack / sink-line comment.
  - exclude:
      id: java/path-injection
      paths:
        - "projects/sitemanage/src/main/java/com/percussion/sitemanage/importer/theme/PSCSSParser.java"
      reason: >-
        Structural fix for #1055-#1057 / PR residuals #1755-#1757 (T043):
        every filesystem open goes through PSPathInjectionGuard.requireUnderBase
        against themeRootDirectory. Model pack barrier for requireUnderBase;
        sink-line suppressions on exists/FileWriter/FileInputStream.
  # --- High java/sql-injection residuals (SecureStringUtils barriers not
  # loaded as model pack — GHA rejects local packs; workflow relies on
  # runtime + sink-line // codeql + path query-filters). ---
  - exclude:
      id: java/sql-injection
      paths:
        - "modules/TableFactory/src/main/java/com/percussion/tablefactory/PSJdbcResultSetIteratorStep.java"
      reason: >-
        Documented residual after structural fix for code-scanning alerts
        #657 / PR residual #1764 (T042). executeQuery is reached only after
        SecureStringUtils.requireFactorySqlStatement rejects multi-statement
        SQL and -- /* comment markers (factory SELECTs never embed comments).
        PSSQLStatement.getStatement always wraps so the general multi-statement
        guard also applies. Sink-line // codeql[java/sql-injection] present.
        Local model-pack barrier rows for requireFactorySqlStatement cannot be
        loaded via GHA packs: (not a valid pack). Regression tests:
        PSJdbcResultSetIteratorStepSqlInjectionTest,
        SecureStringUtilsSqlInjectionTest.
  - exclude:
      id: java/sql-injection
      paths:
        - "modules/utils/src/main/java/com/percussion/util/PSSQLStatement.java"
      reason: >-
        Documented residual after structural fix for code-scanning alerts
        #661 / PR residual #1765 (T042). executeQuery/executeUpdate/execute
        overloads pass SQL through SecureStringUtils.requireSingleSqlStatement
        (rejects embedded ';'/stacked queries; allows -- /* for legitimate
        literals/hints on the general Statement path). getStatement always
        returns the PSSQLStatement wrapper so the guard applies when debug
        logging is off. Prefer PreparedStatement for user values. Sink-line
        // codeql[java/sql-injection] present. Local model-pack barrier cannot
        load in GHA. Regression tests: PSSQLStatementSqlInjectionTest,
        SecureStringUtilsSqlInjectionTest.
  # --- java/unvalidated-url-redirection residuals (PSRedirectValidation) ---
  # Runtime open-redirect closed via PSRedirectValidation + relative-only
  # reduction; local model pack marks validate* as url-redirection barriers.
  # CodeQL still residual-flags Response.seeOther / sendRedirect sinks on
  # PRs (alerts #1762/#1766 reopen of #643-#647). Sink-line // codeql + path
  # exclude stop residual thrashing.
  - exclude:
      id: java/unvalidated-url-redirection
      paths:
        - "deliverytiersuite/delivery-tier-suite/comments/src/main/java/com/percussion/delivery/comments/services/PSCommentsRestService.java"
      reason: >-
        Documented residual after structural fix for code-scanning alerts
        #643/#644 (T051) and PR residual #1762. seeOtherIfSafe reduces
        absolute Referers to path+query+fragment and only redirects after
        PSRedirectValidation.validateInternalRedirectUrl returns a safe
        relative location (null → 204 No Content). Host header is never
        used as an allow-list. Regression tests in
        PSCommentsRestServiceRedirectTest. CodeQL model pack barrier for
        PSRedirectValidation; residual taint through the URI constructor
        still fires without this path exclude.
  - exclude:
      id: java/unvalidated-url-redirection
      paths:
        - "system/src/main/java/com/percussion/servlets/PSSecurityFilter.java"
      reason: >-
        Documented residual after structural fix for code-scanning alerts
        #645-#647 (T051) and PR residual #1766. sendValidatedRedirect only
        calls sendRedirect after PSRedirectValidation accepts the location
        (relative internal path or absolute URL on publicCmsHostname /
        post-isValidHostHeader server name). Regression coverage via
        PSRedirectValidationTest. CodeQL model pack barrier for
        PSRedirectValidation; residual taint still fires at sendRedirect
        without this path exclude.
  # --- java/error-message-exposure residuals (#769/#770/#787, PR #1781–#1784) ---
  # Structural: SimpleXmlView never throws; writeGenericError writes only
  # GENERIC_RENDER_ERROR; success path appends model Document XML only.
  # PSWebdavConfigValidator.writeError(int) writes only constant messages.
  # One path per exclude entry (same pattern as redirect residuals). Sink-line
  # // codeql[java/error-message-exposure] on writer.append(content) and
  # write(GENERIC_RENDER_ERROR). Path exclude stops residual thrash when
  # CodeQL retargets the sink after line shifts.
  - exclude:
      id: java/error-message-exposure
      paths:
        - "modules/perc-toolkit/src/main/java/com/percussion/pso/imageedit/web/SimpleXmlView.java"
      reason: >-
        Structural fix for medium #769 and PR residuals #1781/#1783: no-throw
        render path; constant GENERIC_RENDER_ERROR on failure; success path
        serializes model Document only. Sink-line suppressions on append/write.
  - exclude:
      id: java/error-message-exposure
      paths:
        - "modules/perc-toolkit/src/main/java/com/percussion/pso/preview/SimpleXmlView.java"
      reason: >-
        Structural fix for medium #770 and PR residuals #1782/#1784: same as
        imageedit SimpleXmlView (preview package twin).
  - exclude:
      id: java/error-message-exposure
      paths:
        - "system/servlet/src/com/percussion/webdav/method/PSWebdavConfigValidator.java"
      reason: >-
        Structural fix for medium #787: writeError(int) emits only constant
        GENERIC_VALIDATION_ERROR / GENERIC_VALIDATION_WARNING; details logged.
  # --- Legacy crypto accepted-risk (T047/T048) ---
  # NOT false positives: AES/CBC + fixed IV are intentionally retained so
  # upgrades can decrypt pre-8.2 ciphertext. Production *new* encryption is
  # AES/GCM via com.percussion.security.PSEncryptor. Call sites of PSAesCBC
  # in product code are decrypt-only fallbacks after PSEncryptor fails.
  # See docs/ai-generated/tasks/gh-codeql-alerts/accepted-risks.md
  # (alerts #649, #650, #757, #758, #759) and suppressions.md.
  - exclude:
      id: java/weak-cryptographic-algorithm
      paths:
        - "modules/perc-legacy/src/main/java/com/percussion/legacy/security/deprecated/PSAesCBC.java"
      reason: >-
        Accepted risk (T047): PSAesCBC AES/CBC is required to decrypt
        historical payloads during upgrade of older installs. New product
        encryption uses PSEncryptor (AES/GCM + random IV). Class is
        @Deprecated(forRemoval=true, since=8.2); removal tracked for 9.0
        after a one-shot re-encrypt migration. Not a false positive —
        algorithm is weak but cannot be changed without bricking upgrades.
  - exclude:
      id: java/static-initialization-vector
      paths:
        - "modules/perc-legacy/src/main/java/com/percussion/legacy/security/deprecated/PSAesCBC.java"
      reason: >-
        Accepted risk (T048): fixed IV on PSAesCBC String encrypt/decrypt
        matches pre-8.2 ciphertext layout. Changing the IV would make
        historical secrets undecryptable. New encryption uses random IV
        under AES/GCM (PSAESGCMEncryptor). See accepted-risks.md.
