        packs). Tests: SecureStringUtilsSqlInjectionTest,
        PSDatabasePoolDatabaseMetaDataSqlInjectionTest. Same family as
        PSJdbcTableMetaData #659/#660. Do not re-edit sinks to chase IDs.
  # --- CodeQL #1985-#1987 XML JDBC catalog path-injection ---
  # Runtime: PSVirtualApplicationDirectory.resolveUnderAppRoot +
  # PSFileSystemDriver.getPhysicalPath re-apply requireUnderBase when the
  # virtual root exists. Sink-line on File.exists/isDirectory residuals.
  - exclude:
      id: java/path-injection
      paths:
        - "system/src/main/java/com/percussion/data/jdbc/PSXmlDatabaseMetaData.java"
        - "**/data/jdbc/PSXmlDatabaseMetaData.java"
