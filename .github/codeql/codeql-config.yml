        barrier for SitesAdaptor.requireSafeOutputRoot; same-line
        // codeql[java/path-injection] on createDirectories / resolve("_meta").
        Do not re-edit annotated sinks — each edit opens a new alert ID.
        Tests: SitesAdaptorTest requireSafeOutputRoot / resolveOutputRoot /
        buildVirtualSite. See suppressions.md #1984.
  # --- js/xss-through-dom residuals (imageSlider thumbnail src from DOM title) ---
  # Structural: safeThumbnailSrc rejects javascript:/data:/vbscript:; img built
  # without user data in factory map; src set via .attr after sanitize.
