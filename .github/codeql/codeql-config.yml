# CodeQL config for advanced setup only (.github/workflows/codeql.yml).
# Default setup / Code Quality ignore this file — keep those disabled.
#
# Languages are selected in the workflow matrix (java-kotlin + javascript-typescript).
# This file supplies paths-ignore, Java model packs, and query-filters.

paths-ignore:
  - "**/target/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/.codeql-db/**"
  - "**/.codeql-results/**"
  - "**/docker/dev-data/**"
  - "**/docker/logs/**"

# Local model pack — custom sanitizer barriers for SSRF, LDAP, path injection,
# and XXE. Java-only: do not attach to javascript-typescript analysis (pack
# targets codeql/java-all). See
# docs/ai-generated/tasks/gh-codeql-alerts/codeql-pr-playbook.md
packs:
  java:
    - ./.github/codeql/models

# Per-query exclusion for documented false positives.
# See contracts/C3: every `query-filters exclude` entry MUST have a
# matching row in `docs/ai-generated/tasks/gh-codeql-alerts/suppressions.md`
# with a `file_path` set to `.github/codeql/codeql-config.yml`.
query-filters:
  - exclude:
      id: java/xxe
      paths:
        - "system/business/src/com/percussion/share/dao/PSSerializerUtils.java"
      reason: >-
        Documented CodeQL false positive per contracts/C2 (FR-007).
        The XMLReader returned by PSSecureXMLUtils.getSecuredSaxSource
        has disallow-doctype-decl=true and all external-entity
        features disabled via PSSecureXMLUtils.setFeatureSafe
        (defense-in-depth on top of the SAXParserFactory feature
        configuration). The structural fix is verified by
        PSSerializerUtilsTest.SaxSource.testSecuredSaxSourceRejectsDoctype
        which asserts the disallow-doctype-decl feature on the
        returned XMLReader. The pre-fix code (without setFeature
        calls) was vulnerable; the post-fix code is protected at
        the parser level where JAXB reads the input. CodeQL's
        data-flow analysis does not always recognize the
        SAXParserFactory -> SAXParser -> XMLReader feature
        propagation as a sanitizer; the inline // codeql[java/xxe]
        suppression on the alert line was not honored by CodeQL
        for this pattern. See specs/004-zero-code-scanning-alerts/
        tasks.md T039 and GitHub code-scanning advisory #1710.
        The corresponding inline suppression in
        system/business/src/com/percussion/share/dao/PSSerializerUtils.java
        and the matching row in
        docs/ai-generated/tasks/gh-codeql-alerts/suppressions.md
        (alert_id=2) document this exception per contracts/C2 and C3.
  - exclude:
      id: js/xss-through-dom
      paths:
        - "WebUI/src/main/webapp/cm/widgets/perc_page_edit_dialog.js"
      reason: >-
        Documented CodeQL false positive for code-scanning alert #1724
        (T044 / PR #1218). The sanitizer inside
        `window.PercPageEditSanitizer.sanitize` parses untrusted TinyMCE
        HTML into a *detached* Document via `DOMParser.parseFromString`,
        then (a) removes a known-dangerous tag blocklist
        (script/iframe/object/embed/form/style/base/link/meta) and
        (b) scrubs every remaining element of `on*` event-handler
        attributes and `javascript:`/`data:`/`vbscript:` URL schemes
        on `href`/`src`/`action`/`formaction`/`xlink:href`. Surviving
        children reach the live document through `document.importNode`
        + `appendChild` only -- never `innerHTML` or jQuery `.html()`.
        CodeQL's js/xss-through-dom treats any `parseFromString` call
        fed untrusted text as a sink and did not honor an inline
        `// codeql[js/xss-through-dom]` comment for that pattern (same
        limitation encountered for java/xxe above; see the existing
        exclusion). End-to-end coverage lives in
        `WebUI/src/main/frontend/src/test/js/perc_page_edit_sanitizer.test.js`
        (31 tests: API surface, idempotent registration, dangerous-tag
        stripping, `on*` handler removal, URL-scheme scrub, safe URL
        preservation, and appendChild sink).

        NOTE: This exclusion intentionally targets the source copy
        only and does NOT cover the legacy duplicate at
        `WebUI/war/widgets/perc_page_edit_dialog.js`, which still has
        the original unsanitized `.html(content)` sink. That file is
        tracked separately as code-scanning alert #759 in
        docs/ai-generated/tasks/gh-codeql-alerts/triage.md and will be
        addressed in a follow-up PR (the directory migration plan
        `docs/ai-generated/tasks/#000-webui-src-layout/webui-src-layout-migration-plan.md`
        calls for retiring `war/widgets/**`).
  # --- Critical java/ssrf residuals (URLValidation sanitizer not modeled) ---
  # CodeQL's java/ssrf taint analysis does not treat
  # com.percussion.security.validation.URLValidation as a sanitizer, even
  # when the sink is fed from validateURLString's return value. Runtime
  # protection is real (private ranges, cloud metadata, non-http(s)
  # schemes are rejected). Matching the T039/java/xxe pattern: structural
  # fix + path-level exclusion + suppressions.md row. Inline
  # // codeql[java/ssrf] comments alone are not always honored.
  - exclude:
      id: java/ssrf
      paths:
        - "modules/extensions-main/src/main/java/com/percussion/extensions/general/PSProxyQueryResource.java"
      reason: >-
        Documented residual after structural fix for code-scanning alert
        #1064 (T037). Outbound HttpRequest is built only after
        URLValidation.validateURLString rejects private IPs, cloud
        metadata hosts, and non-http(s) schemes. Internal targets are
        forced to 127.0.0.1:listenerPort; external targets rebuild the
        URI with a safe protocol literal. Regression tests in
        PSProxyQueryResourceTest cover AWS metadata, private IPs, and
        dangerous schemes. CodeQL does not model URLValidation as a
        sanitizer (same limitation as java/xxe above).
  - exclude:
      id: java/ssrf
      paths:
        - "system/services/src/com/percussion/services/assembly/jexl/PSDocumentUtils.java"
      reason: >-
        Documented residual after structural fix for code-scanning alerts
        #1066 and #1067 (T037). getExternalDocument validates via
        URLValidation.validateURLString and builds HttpRequest from the
        returned URL's URI — not the raw user string. Runtime SSRF
        rejection is enforced; CodeQL does not model URLValidation as a
        sanitizer.
  - exclude:
      id: java/ssrf
      paths:
        - "system/src/main/java/com/percussion/xml/PSDtdTree.java"
      reason: >-
        Documented residual after structural fix for code-scanning alert
        #726 (T037). Non-file DTD URLs are validated with
        URLValidation.validateURLString; openConnection is called on the
        returned URL only. CodeQL does not model URLValidation as a
        sanitizer.
  - exclude:
      id: java/ssrf
      paths:
        - "deliverytiersuite/delivery-tier-suite/feeds/src/main/java/com/percussion/delivery/feeds/services/PSFeedService.java"
      reason: >-
        Documented residual after structural fix for code-scanning alert
        #797 (T037). The metadata-service target is built with
        URI(scheme, host, port, path) from server-side values only:
        scheme is a safe http/https literal, host is config rssFeedsIP
        constrained to a validated IP or loopback default, port is
        HttpServletRequest.getLocalPort(), path is a fixed constant.
        No client-controlled host or path reaches Client.target.
  - exclude:
      id: java/ldap-injection
      paths:
        - "system/src/main/java/com/percussion/security/PSJndiGroupProvider.java"
      reason: >-
        Documented residual after structural fix for code-scanning alert
        #648 (T040). User filter values pass through
        PSJndiUtils.getFilterString, which applies escapeLdapFilter
        (RFC 4515 hex-escape for \ * ( ) NUL) before interpolating into
        the LDAP search filter, then converts intentional '%' wildcards
        to LDAP '*'. Classic injection payload "*)(objectClass=*" is
        neutralized. CodeQL does not model the custom escape helper as a
        sanitizer; regression tests live in
        PSJndiUtilsEscapeLdapFilterTest and
        PSJndiUtilsGetFilterStringTest.
