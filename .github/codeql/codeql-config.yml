        - "projects/sitemanage/src/main/java/com/percussion/apibridge/AssetAdaptor.java"
        - "projects/sitemanage/src/main/java/com/percussion/sitemanage/service/impl/PSSiteDataService.java"
        - "projects/sitemanage/src/main/java/com/percussion/pagemanagement/service/impl/PSRenderLinkService.java"
        - "projects/sitemanage/src/main/java/com/percussion/cloudservice/impl/PSCloudService.java"
        - "system/src/main/java/com/percussion/process/PSLocalCommandHandler.java"
        - "system/src/main/java/com/percussion/process/PSProcessDaemon.java"
        - "system/src/main/java/com/percussion/xml/PSDtdTree.java"
        - "system/src/main/java/com/percussion/server/PSServer.java"
        - "projects/sitemanage/src/main/java/com/percussion/apibridge/SitesAdaptor.java"
        - "system/services/src/com/percussion/services/virtualsite/PSVirtualSiteBuildService.java"
        - "system/services/src/com/percussion/services/virtualsite/PSInMemoryVirtualParticipantService.java"
        - "system/services/src/com/percussion/services/virtualsite/VirtualRedirectsEmitter.java"
      reason: >-
        Documented multi-pass T043 residuals after structural guards (includes
        PSThemeService from PR #1361 + broader residual batch PR #1362) plus
        Virtual Site build SitesAdaptor (#1951/#1952/#1961 thrash #1967/#1968)
        and offline Virtual Site services (#1956–#1960/#1962–#1966 thrash
        #1969–#1976 on PR #3078).
        Each product sink is gated by PSPathInjectionGuard or file-local
        validatePath / requireSafeFilePath / requireSafeOutputRoot /
        requireSafeBuildRoot / requireSafeStoreDirectory before File
        or NIO I/O. CodeQL Advanced + auto-injected scans still residual-flag
        File.exists/delete/mkdirs/streams, Files.createDirectories, and Path.resolve
        after those barriers even with same-line // codeql[java/path-injection].
        Path excludes + sink-line suppressions + behavioral security tests
        (PSThemeServiceSecurityTest, PSRegionCSSFileServiceSecurityTest,
        PSCSSParserPathInjectionTest, PSImportThemeHelperPathInjectionTest,
        SitesAdaptorTest requireSafeOutputRoot / buildVirtualSite,
        PSVirtualSiteBuildServiceTest / PSInMemoryVirtualParticipantServiceTest /
        VirtualRedirectsEmitterTest path-injection barriers, etc.).
        VirtualRedirectsEmitter (#1983) writes redirects.json via resolveHref
        after requireSafeBuildRoot. Do not re-edit sinks only to chase IDs.
        SitesAdaptor #1984 (2026-08-21) is a line-shift re-fingerprint of
        #1967/#1968 after PR #3710; dedicated one-file exclude below.
  # --- CodeQL #1984 SitesAdaptor resolve("_meta") residual (do not re-edit sinks) ---
  # Runtime + model + same-line // codeql[java/path-injection] already on main.
  # Bulk T043 exclude above already lists this file; one-file entry + glob so
  # query-filters still match after line-shift re-fingerprint (PR #3710).
  - exclude:
