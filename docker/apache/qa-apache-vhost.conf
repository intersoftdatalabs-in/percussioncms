# QA automation cell Apache frontend (issue #7323).
#
# Mounted read-only into the stock `httpd:2.4` sidecar at
# /usr/local/apache2/conf/qa-cell.conf and loaded with a trailing
# httpd `-c "Include conf/qa-cell.conf"` docker-run arg (no custom
# image build: `httpd-foreground` appends extra args to
# `httpd -DFOREGROUND`, and `-c` Include runs before the stock main
# conf. Duplicate `LoadModule` lines warn-and-continue, but a duplicate
# `Listen` is fatal — hence this file adds only :443 (stock already
# listens on :80). Perc-devctl bind-mounts this file plus the
# fixture DocumentRoot and the mkcert output dir, and passes the
# backend/hostname below as container env (`-e` args) — httpd
# interpolates `${VAR}` from the environment, while command-line
# `-D` defines do NOT reach `-c`-included files.
#
# Variables (container env):
#   DTS_BACKEND     — QA DTS (Tomcat) cell container name on
#                     perc-matrix-net, e.g. perc-matrix-dts-h2
#   APACHE_HOSTNAME — CMS test-site hostname this vhost answers as,
#                     e.g. qa-published.percussion.local
#
# Topology (per the DTS-frontend reference doc): Apache terminates
# 80/443, serves the published static tree (fixture site) directly from
# the bind-mounted DocumentRoot, and reverse-proxies every DTS dynamic
# service context plus a `/` fallback to the Tomcat cell behind it.

# In-cell listeners: the stock `httpd:2.4` main conf already `Listen 80`,
# so this file adds only :443 (a duplicate `Listen 80` is a fatal
# "multiple Listeners on the same IP:port" error). Host publishes are
# freeport-mapped by perc-devctl (preferred 80/443 when free).
Listen 443

# Proxy + TLS modules (shipped in httpd:2.4, enabled here explicitly).
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

SSLSessionCache "shmcb:logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# Common proxy tuning for the Tomcat backend.
ProxyPreserveHost On
ProxyTimeout 60

<VirtualHost *:80>
    ServerName ${APACHE_HOSTNAME}
    ServerAlias localhost 127.0.0.1

    DocumentRoot /usr/local/apache2/htdocs/site
    DirectoryIndex index.html
    <Directory /usr/local/apache2/htdocs/site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Static offload: the published fixture tree is served locally.
    # NOTE: `^/$` must stay first — `/` matches the `ProxyPass /`
    # fallback in the URL-translation phase (before DirectoryIndex
    # subrequests), so without it the home page would proxy instead
    # of serving the local index.html.
    ProxyPassMatch ^/$ !
    ProxyPass /web_resources/ !
    ProxyPass /widgets/ !
    ProxyPass /index.html !
    ProxyPass /category.html !

    # DTS dynamic service contexts (war names = artifactIds) ride the
    # vhost to the Tomcat cell behind Apache.
    ProxyPass /perc-comments-services/ http://${DTS_BACKEND}:9980/perc-comments-services/
    ProxyPassReverse /perc-comments-services/ http://${DTS_BACKEND}:9980/perc-comments-services/
    ProxyPass /feeds/ http://${DTS_BACKEND}:9980/feeds/
    ProxyPassReverse /feeds/ http://${DTS_BACKEND}:9980/feeds/
    ProxyPass /perc-form-processor/ http://${DTS_BACKEND}:9980/perc-form-processor/
    ProxyPassReverse /perc-form-processor/ http://${DTS_BACKEND}:9980/perc-form-processor/
    ProxyPass /perc-membership-services/ http://${DTS_BACKEND}:9980/perc-membership-services/
    ProxyPassReverse /perc-membership-services/ http://${DTS_BACKEND}:9980/perc-membership-services/
    ProxyPass /perc-metadata-services/ http://${DTS_BACKEND}:9980/perc-metadata-services/
    ProxyPassReverse /perc-metadata-services/ http://${DTS_BACKEND}:9980/perc-metadata-services/
    ProxyPass /perc-polls-services/ http://${DTS_BACKEND}:9980/perc-polls-services/
    ProxyPassReverse /perc-polls-services/ http://${DTS_BACKEND}:9980/perc-polls-services/
    ProxyPass /perc-secure-membership/ http://${DTS_BACKEND}:9980/perc-secure-membership/
    ProxyPassReverse /perc-secure-membership/ http://${DTS_BACKEND}:9980/perc-secure-membership/

    # Fallback: everything else (fixture pages served by DTS ROOT,
    # backend-owned error documents, future publish paths) proxies to
    # the Tomcat ROOT webapp so the vhost never 404s what DTS can serve.
    ProxyPass / http://${DTS_BACKEND}:9980/
    ProxyPassReverse / http://${DTS_BACKEND}:9980/

    ErrorLog logs/qa-cell-80-error.log
    CustomLog logs/qa-cell-80-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ${APACHE_HOSTNAME}
    ServerAlias localhost 127.0.0.1

    SSLEngine on
    SSLCertificateFile /certs/apache-cert.pem
    SSLCertificateKeyFile /certs/apache-key.pem

    DocumentRoot /usr/local/apache2/htdocs/site
    DirectoryIndex index.html
    <Directory /usr/local/apache2/htdocs/site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Same static-offload + proxy map as :80 (kept in sync by hand;
    # covered by test_qa_apache_cell.py::VhostConfParityTests).
    # NOTE: `^/$` must stay first (same DirectoryIndex reason as :80).
    ProxyPassMatch ^/$ !
    ProxyPass /web_resources/ !
    ProxyPass /widgets/ !
    ProxyPass /index.html !
    ProxyPass /category.html !

    ProxyPass /perc-comments-services/ http://${DTS_BACKEND}:9980/perc-comments-services/
    ProxyPassReverse /perc-comments-services/ http://${DTS_BACKEND}:9980/perc-comments-services/
    ProxyPass /feeds/ http://${DTS_BACKEND}:9980/feeds/
    ProxyPassReverse /feeds/ http://${DTS_BACKEND}:9980/feeds/
    ProxyPass /perc-form-processor/ http://${DTS_BACKEND}:9980/perc-form-processor/
    ProxyPassReverse /perc-form-processor/ http://${DTS_BACKEND}:9980/perc-form-processor/
    ProxyPass /perc-membership-services/ http://${DTS_BACKEND}:9980/perc-membership-services/
    ProxyPassReverse /perc-membership-services/ http://${DTS_BACKEND}:9980/perc-membership-services/
    ProxyPass /perc-metadata-services/ http://${DTS_BACKEND}:9980/perc-metadata-services/
    ProxyPassReverse /perc-metadata-services/ http://${DTS_BACKEND}:9980/perc-metadata-services/
    ProxyPass /perc-polls-services/ http://${DTS_BACKEND}:9980/perc-polls-services/
    ProxyPassReverse /perc-polls-services/ http://${DTS_BACKEND}:9980/perc-polls-services/
    ProxyPass /perc-secure-membership/ http://${DTS_BACKEND}:9980/perc-secure-membership/
    ProxyPassReverse /perc-secure-membership/ http://${DTS_BACKEND}:9980/perc-secure-membership/

    ProxyPass / http://${DTS_BACKEND}:9980/
    ProxyPassReverse / http://${DTS_BACKEND}:9980/

    ErrorLog logs/qa-cell-443-error.log
    CustomLog logs/qa-cell-443-access.log combined
</VirtualHost>
