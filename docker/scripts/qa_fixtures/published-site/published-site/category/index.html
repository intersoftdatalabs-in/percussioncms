<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA fixture category list (issue #6243)</title>
<link rel="stylesheet" href="/web_resources/cm/css/fancytree/skin/ui.fancytree.css">
</head>
<body>
<main>
<h1>Site categories</h1>
<!--
  Published category-list widget markup: the delivery bundle view
  (PercCategoryListView.js) renders .perc-category-list-collapsible and
  invokes .fancytree(. The nested list below exercises the expand path
  asserted by published-category-tree-fancytree.spec.js (#6189 checkbox 1):
  the "News" node starts collapsed with two visible children after expand.
  -->
<div class="perc-category-list perc-category-list-collapsible">
<ul style="display:none">
<li>News
<ul>
<li>Local</li>
<li>World</li>
</ul>
</li>
<li>Events</li>
</ul>
</div>
<p><a href="/published-site/">Back to the published home page</a></p>
</main>
<script src="/web_resources/cm/jslib/jquery.js"></script>
<script src="/web_resources/cm/jslib/jquery-ui.js"></script>
<script src="/web_resources/cm/jslib/jquery.fancytree.js"></script>
<script>
jQuery(function ($) {
  $(".perc-category-list-collapsible").fancytree({ selectMode: 1 });
});
</script>
</body>
</html>
