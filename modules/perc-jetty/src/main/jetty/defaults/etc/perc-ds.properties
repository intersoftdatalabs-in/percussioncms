# Percussion Datasource properties
# Used by perc-ds.xml for the Rhythmyx default datasource
# Installer overwrites based on selected DB configuration

# Datasource 1: RhythmyxDS (Primary repository datasource)
perc.ds.1.name=RhythmyxDS
perc.ds.1.driver.name=h2
perc.ds.1.driver.class=org.h2.Driver
perc.ds.1.connectiontest=SELECT 1

# File H2 under install Repository/ (relative to jetty.base); see #548
perc.ds.1.server=file:../../Repository/CMDB;DB_CLOSE_ON_EXIT=FALSE
perc.ds.1.uid=sa
perc.ds.1.pwd=
perc.ds.1.pwd.encrypted=N

perc.ds.1.connections.min=5
perc.ds.1.connections.max=20
perc.ds.1.idle.ms=600000
