#Percussion Datasource properties get set here
# These properties are used by perc-ds.xml to configure the Rhythmyx default datasource
# The installer will populate these values based on the database configuration selected during install

# Datasource 1: RhythmyxDS (Primary repository datasource)
# Driver configuration
perc.ds.1.name=RhythmyxDS
perc.ds.1.driver.name=derby
perc.ds.1.driver.class=org.apache.derby.jdbc.EmbeddedDriver
perc.ds.1.connectiontest=SELECT 1

# Server connection
perc.ds.1.server=memory:musicbrainz
perc.ds.1.uid=
perc.ds.1.pwd=
perc.ds.1.pwd.encrypted=N

# Connection pool settings
perc.ds.1.connections.min=5
perc.ds.1.connections.max=20
perc.ds.1.idle.ms=600000
