# =============================================================================
# blockedUrls.properties — denied outbound URL patterns
# =============================================================================
# Location (install root): rxconfig/Server/blockedUrls.properties
#
# Block matches ALWAYS deny, even if baseline or allowedUrls would permit.
# Patterns are full absolute-URL globs (* = multi-character wildcard).
# A pattern that is only "*" is ignored.
# Upgrade never overwrites this file if it already exists.
#
# Default active entries preserve pre-8.2 hard-coded dangerous destinations.
# You may add more block lines below.

http://169.254.169.254/*
https://169.254.169.254/*
http://0.0.0.0/*
https://0.0.0.0/*
http://metadata.google.internal/*
https://metadata.google.internal/*
http://169.254.169.253/*
https://169.254.169.253/*
