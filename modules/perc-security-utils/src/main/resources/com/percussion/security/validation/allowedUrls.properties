# =============================================================================
# allowedUrls.properties — additional permitted outbound URL patterns
# =============================================================================
# Location (install root): rxconfig/Server/allowedUrls.properties
#
# Policy (issue #1205 / SSRF hardening):
#   1. Only http and https schemes are allowed (this file cannot enable others).
#   2. Block list (blockedUrls.properties) always wins over allow and baseline.
#   3. Baseline still permits: loopback (any port); public hosts on port 80/443.
#   4. Patterns in THIS file are ADDITIVE: they unlock targets that would fail
#      baseline (e.g. private/internal hosts, nonstandard ports, path-scoped APIs).
#   5. Matching is a full absolute-URL GLOB (* = multi-character wildcard).
#   6. A pattern that is only "*" is ignored (does not allow everything).
#   7. Changes require a server restart.
#   8. Upgrade never overwrites this file if it already exists.
#
# Active patterns: one absolute URL glob per line (not starting with #).
# Examples below are COMMENTED OUT — uncomment/edit to activate.
#
# --- Examples (inactive) ---
# https://api.openweathermap.org/*
# http://hr.internal.example.com:8080/api/*
# https://i18n.example.com/v1/translate*
