# Sample CMS repository target for PostgreSQL (new CLI install) — GitHub #1500.
# Usage:
#   java -Ddbprops=/path/to/this-file.properties -jar PercussionCMS.jar /path/to/install/root
# Or:
#   java -jar PercussionCMS.jar /path/to/install/root --dbprops=/path/to/this-file.properties
#
# Pre-create an empty database and role with CREATE privileges. Replace placeholders below.
# Default schema is public when DB_SCHEMA is empty (product convention).

DB_BACKEND=POSTGRES
DB_SERVER=//db.example.com:5432/percussion
DB_NAME=percussion
DB_SCHEMA=public
DB_DRIVER_NAME=postgresql
DB_DRIVER_CLASS_NAME=org.postgresql.Driver
UID=cms
PWD=changeit
PWD_ENCRYPTED=N
DSCONFIG_NAME=PercussionData
DB_SSL_ENABLED=true
DB_SSL_VERIFY=true
DB_SSL_ALLOW_SELF_SIGNED=false
