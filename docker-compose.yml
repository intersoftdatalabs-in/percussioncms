services:
  # ============================================================
  # Dev CMS (bind-mounted install from host) - for development
  # ============================================================
  cms-dts:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-dts
    restart: unless-stopped
    user: "${CMS_UID:-1000}:${CMS_GID:-1001}"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-cms-dts}
      PERC_INSTALL_ROOT: ${PERC_INSTALL_ROOT:-/opt/Percussion}
      CMS_PORT: ${CMS_PORT:-9992}
      DTS_PORT: ${DTS_PORT:-9980}
    ports:
      - "${CMS_PORT:-9992}:9992"
      - "${DTS_PORT:-9980}:9980"
    volumes:
      - ${PROJECT_ROOT:-.}:/workspace:ro
      - /opt/Percussion:/opt/Percussion
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'cms=$$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:9992/Rhythmyx/login || true); ([ "$$cms" = "200" ] || [ "$$cms" = "302" ])',
        ]
      interval: 20s
      timeout: 5s
      retries: ${PERC_HEALTHCHECK_RETRIES:-60}
      start_period: ${PERC_HEALTHCHECK_START_PERIOD:-30s}

  # ============================================================
  # Fresh install CMS containers for database backend testing
  # Each service: starts DB, installs CMS fresh, starts Jetty
  # Usage: docker compose --profile cms-h2 up -d
  # ============================================================

  cms-h2:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-h2
    restart: unless-stopped
    profiles:
      - cms-h2
      - cms-all
    user: "1000:1001"
    environment:
      CMS_PORT: "9993"
      DB_TYPE: "h2"
    ports:
      - "9993:9993"
    volumes:
      - perc-h2-data:/opt/Percussion
    command: >
      /bin/sh -c "
        echo 'Installing CMS with H2...' &&
        java -jar /workspace/modules/perc-distribution-tree/target/perc-distribution-tree-*-bin.zip-extracted/perc-distribution-tree-*/perc-preinstall.jar
        /opt/Percussion --silent --db.type=h2 &&
        /opt/Percussion/StartJetty.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9993/Rhythmyx/login | grep -q '200\\|302'"]
      interval: 30s
      timeout: 10s
      retries: 60

  cms-mysql:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-mysql
    restart: unless-stopped
    profiles:
      - cms-mysql
      - cms-all
    user: "1000:1001"
    environment:
      CMS_PORT: "9994"
      DB_TYPE: "mysql"
    ports:
      - "9994:9994"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - perc-mysql-data:/opt/Percussion
    command: >
      /bin/sh -c "
        echo 'Waiting for MySQL...' &&
        until mysql -h mysql -u percuser -pPercPass123 -e 'SELECT 1' 2>/dev/null; do
          sleep 2;
        done &&
        echo 'MySQL ready, installing CMS...' &&
        java -jar /workspace/modules/perc-distribution-tree/target/perc-distribution-tree-*-bin.zip-extracted/perc-distribution-tree-*/perc-preinstall.jar
        /opt/Percussion --silent
        --db.type=mysql
        --db.host=mysql
        --db.port=3306
        --db.name=percdb
        --db.user=percuser
        --db.password=PercPass123 &&
        /opt/Percussion/StartJetty.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9994/Rhythmyx/login | grep -q '200\\|302'"]
      interval: 30s
      timeout: 10s
      retries: 60

  cms-postgresql:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-postgresql
    restart: unless-stopped
    profiles:
      - cms-postgresql
      - cms-all
    user: "1000:1001"
    environment:
      CMS_PORT: "9995"
      DB_TYPE: "postgresql"
    ports:
      - "9995:9995"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - perc-postgres-data:/opt/Percussion
    command: >
      /bin/sh -c "
        echo 'Waiting for PostgreSQL...' &&
        until pg_isready -h postgres -U percuser 2>/dev/null; do
          sleep 2;
        done &&
        echo 'PostgreSQL ready, installing CMS...' &&
        java -jar /workspace/modules/perc-distribution-tree/target/perc-distribution-tree-*-bin.zip-extracted/perc-distribution-tree-*/perc-preinstall.jar
        /opt/Percussion --silent
        --db.type=postgresql
        --db.host=postgres
        --db.port=5432
        --db.name=percdb
        --db.user=percuser
        --db.password=PercPass123 &&
        /opt/Percussion/StartJetty.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9995/Rhythmyx/login | grep -q '200\\|302'"]
      interval: 30s
      timeout: 10s
      retries: 60

  cms-sqlserver:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-sqlserver
    restart: unless-stopped
    profiles:
      - cms-sqlserver
      - cms-all
    user: "1000:1001"
    environment:
      CMS_PORT: "9996"
      DB_TYPE: "sqlserver"
    ports:
      - "9996:9996"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - perc-sqlserver-data:/opt/Percussion
    command: >
      /bin/sh -c "
        echo 'Waiting for SQL Server...' &&
        sleep 15 &&
        echo 'SQL Server ready, installing CMS...' &&
        java -jar /workspace/modules/perc-distribution-tree/target/perc-distribution-tree-*-bin.zip-extracted/perc-distribution-tree-*/perc-preinstall.jar
        /opt/Percussion --silent
        --db.type=sqlserver
        --db.host=sqlserver
        --db.port=1433
        --db.name=percdb
        --db.user=percuser
        --db.password=PercPass123! &&
        /opt/Percussion/StartJetty.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9996/Rhythmyx/login | grep -q '200\\|302'"]
      interval: 30s
      timeout: 10s
      retries: 60

  # ============================================================
  # Database backends for CMS testing
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: percussion-mysql
    restart: unless-stopped
    profiles:
      - mysql
      - db-all
    environment:
      MYSQL_ROOT_MKD-REDACT-xxxxxxxxxxxxxxxxxx      MYSQL_USER: percuser
      MYSQL_MKD-REDACT-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      MYSQL_DATABASE: percdb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pPercRootPass123"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: percussion-postgres
    restart: unless-stopped
    profiles:
      - postgres
      - db-all
    environment:
      POSTGRES_USER: percuser
      POSTGRES_MKD-REDACT-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      POSTGRES_DB: percdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U percuser -d percdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: percussion-sqlserver
    restart: unless-stopped
    profiles:
      - sqlserver
      - db-all
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_MKD-REDACT-xxxxxxxxxxxxxxxxxxxxxx      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'PercPass123!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  postgres-data:
  sqlserver-data:
  perc-h2-data:
  perc-mysql-data:
  perc-postgres-data:
  perc-sqlserver-data:
