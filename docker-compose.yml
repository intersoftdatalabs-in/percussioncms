services:
  cms-dts:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-dts
    restart: unless-stopped
    # Run as the host UID/GID that owns /opt/Percussion. StartJetty.sh
    # compares `whoami` to the owner of /opt/Percussion and refuses to
    # su to a UID that doesn't exist in the container's /etc/passwd, so
    # the container's UID MUST match the host's install-root owner.
    #
    # Override per host via .env.compose (CMS_UID / CMS_GID) or the env
    # of the docker compose invocation. Default is 1000:1001 which
    # matches the nate:mkd-dev owner that installed /opt/Percussion
    # in the original dev setup; other developers can override.
    user: "${CMS_UID:-1000}:${CMS_GID:-1001}"
    environment:
      # Container is service-only. The install lives entirely on the
      # host (scripts/install-cms-dev.py) and the bind mount below
      # surfaces the host's install_root/ as /opt/Percussion/.
      SERVICE_MODE: ${SERVICE_MODE:-cms-dts}
      PERC_INSTALL_ROOT: ${PERC_INSTALL_ROOT:-/opt/Percussion}
      CMS_PORT: ${CMS_PORT:-9992}
      DTS_PORT: ${DTS_PORT:-9980}
    ports:
      - "${CMS_PORT:-9992}:9992"
      - "${DTS_PORT:-9980}:9980"
    volumes:
      - ${PROJECT_ROOT:-.}:/workspace:ro
      # Single bind mount: the host install_root MUST equal the
      # in-container path. The installer writes absolute paths into
      # config files (rxrepository.properties etc.); if the host path
      # differs from /opt/Percussion, those recorded paths will not
      # resolve inside the container.
      - /opt/Percussion:/opt/Percussion
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'cms=$$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:9992/Rhythmyx/login || true); ([ "$$cms" = "200" ] || [ "$$cms" = "302" ])',
        ]
      interval: 20s
      timeout: 5s
      retries: ${PERC_HEALTHCHECK_RETRIES:-60}
      start_period: ${PERC_HEALTHCHECK_START_PERIOD:-30s}

  # ============================================================
  # Database backends for testing - use --profile to activate
  # Example: docker compose --profile mysql up -d
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: percussion-mysql
    restart: unless-stopped
    profiles:
      - mysql
      - db-all
    environment:
      MYSQL_ROOT_PASSWORD: percroot
      MYSQL_USER: percuser
      MYSQL_MKD-REDACT-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      MYSQL_DATABASE: percdb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppercroot"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: percussion-postgres
    restart: unless-stopped
    profiles:
      - postgres
      - db-all
    environment:
      POSTGRES_USER: percuser
      POSTGRES_MKD-REDACT-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      POSTGRES_DB: percdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U percuser -d percdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: percussion-sqlserver
    restart: unless-stopped
    profiles:
      - sqlserver
      - db-all
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: PercUser123!
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P PercUser123! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  postgres-data:
  sqlserver-data:
