services:
  # ============================================================
  # Dev CMS (bind-mounted install from host) - for development
  # ============================================================
  cms-dts:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-dts
    restart: unless-stopped
    user: "${CMS_UID:-1000}:${CMS_GID:-1001}"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-cms-dts}
      PERC_INSTALL_ROOT: ${PERC_INSTALL_ROOT:-/opt/Percussion}
      CMS_PORT: ${CMS_PORT:-9992}
      DTS_PORT: ${DTS_PORT:-9980}
    ports:
      - "${CMS_PORT:-9992}:9992"
      - "${DTS_PORT:-9980}:9980"
    volumes:
      - ${PROJECT_ROOT:-.}:/workspace:ro
      - /opt/Percussion:/opt/Percussion
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'cms=$$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:9992/Rhythmyx/login || true); ([ "$$cms" = "200" ] || [ "$$cms" = "302" ])',
        ]
      interval: 20s
      timeout: 5s
      retries: ${PERC_HEALTHCHECK_RETRIES:-60}
      start_period: ${PERC_HEALTHCHECK_START_PERIOD:-30s}

  # ============================================================
  # Database backends for matrix install smoke (#1500)
  #
  # Ephemeral CMS/DTS install cells are NOT long-lived compose
  # services. Use:
  #   python3 docker/scripts/matrix-install-smoke.py \
  #     --product cms,dts --db h2,postgresql
  # which mounts perc-distribution-tree*.jar /
  # delivery-tier-distribution*.jar, runs silent install, starts
  # the product, probes login/health, records results, and
  # destroys the cell (unless --keep for Playwright Layer 2).
  # See docker/README.md and docker/matrix/.
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: percussion-mysql
    restart: unless-stopped
    profiles:
      - mysql
      - db-all
    environment:
      MYSQL_ROOT_PASSWORD: PercRootPass123
      MYSQL_USER: percuser
      MYSQL_PASSWORD: PercPass123
      MYSQL_DATABASE: percdb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pPercRootPass123",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: percussion-postgres
    restart: unless-stopped
    profiles:
      - postgres
      - db-all
    environment:
      POSTGRES_USER: percuser
      POSTGRES_PASSWORD: PercPass123
      POSTGRES_DB: percdb
    ports:
      # Host 5432 is often taken by a local Postgres; cells reach DB via Docker DNS
      # alias ``postgres:5432`` on perc-matrix-net (matrix-install-smoke).
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U percuser -d percdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: percussion-sqlserver
    restart: unless-stopped
    profiles:
      - sqlserver
      - db-all
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: PercPass123!
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PercPass123!' -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  postgres-data:
  sqlserver-data:
