services:
  # ============================================================
  # Dev CMS (bind-mounted install from host) - for development
  # ============================================================
  cms-dts:
    build:
      context: .
      dockerfile: docker/cms/Dockerfile
    container_name: percussion-cms-dts
    restart: unless-stopped
    user: "${CMS_UID:-1000}:${CMS_GID:-1001}"
    environment:
      SERVICE_MODE: ${SERVICE_MODE:-cms-dts}
      PERC_INSTALL_ROOT: ${PERC_INSTALL_ROOT:-/opt/Percussion}
      CMS_PORT: ${CMS_PORT:-9992}
      DTS_PORT: ${DTS_PORT:-9980}
    ports:
      - "${CMS_PORT:-9992}:9992"
      - "${DTS_PORT:-9980}:9980"
    volumes:
      - ${PROJECT_ROOT:-.}:/workspace:ro
      - /opt/Percussion:/opt/Percussion
    # #2481: HTTP ready codes + in-container Jetty log scan for dead Rhythmyx
    # ApplicationContext (same markers as docker/scripts/rhythmyx_ready.py).
    # Operators: docker inspect -f "{{.State.Health.Status}}" percussion-cms-dts
    #   healthy   = login/probe ready and no context-failure markers in logs
    #   unhealthy = context failed and/or login not ready (do not run Playwright)
    #   starting  = within start_period (first boot)
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/rhythmyx_healthcheck.py"]
      interval: 20s
      timeout: 10s
      retries: ${PERC_HEALTHCHECK_RETRIES:-60}
      start_period: ${PERC_HEALTHCHECK_START_PERIOD:-30s}

  # ============================================================
  # Database backends for matrix install smoke (#1500)
  #
  # Ephemeral CMS/DTS install cells are NOT long-lived compose
  # services. Use:
  #   python3 docker/scripts/matrix-install-smoke.py \
  #     --product cms,dts --db h2,postgresql
  # which mounts perc-distribution-tree*.jar /
  # delivery-tier-distribution*.jar, runs silent install, starts
  # the product, probes login/health, records results, and
  # destroys the cell (unless --keep for Playwright Layer 2).
  # See docker/README.md and docker/matrix/.
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: percussion-mysql
    restart: unless-stopped
    profiles:
      - mysql
      - db-all
    environment:
      # Credentials from .env.compose (gitignored). See .env.compose.example.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.compose}
      MYSQL_USER: ${MYSQL_USER:-percuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.compose}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-percdb}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Uses container env (no password literal in the compose file).
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: percussion-postgres
    restart: unless-stopped
    profiles:
      - postgres
      - db-all
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-percuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
      POSTGRES_DB: ${POSTGRES_DB:-percdb}
    ports:
      # Host 5432 is often taken by a local Postgres; cells reach DB via Docker DNS
      # alias ``postgres:5432`` on perc-matrix-net (matrix-install-smoke).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: percussion-sqlserver
    restart: unless-stopped
    profiles:
      - sqlserver
      - db-all
    environment:
      ACCEPT_EULA: "Y"
      # Must meet SQL Server complexity rules (upper/lower/digit/symbol).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.compose}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Oracle XE for matrix install smoke (#1508 / live residual #2083 / parent #1500).
  # Image: gvenzl/oracle-xe (community Oracle XE packaging). Heavy RAM/disk and
  # slow first start; opt-in profile only (not part of default up).
  # Observed pull digest (pin optionally): sha256:ecdf4302ac3d134e1bac5ef6e0c223c2d0f4d4d2b6d551aa79b2346f1ab8f792
  # Cells reach the DB via Docker DNS alias ``oracle:1521`` on perc-matrix-net.
  # Installer uses --db.name as Easy Connect service name (default XEPDB1; not SID)
  # and APP_USER as schema. See docker/README.md § Oracle compose profile.
  # Credentials from .env.compose only.
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: percussion-oracle
    restart: unless-stopped
    profiles:
      - oracle
      - db-all
    environment:
      # SYS/SYSTEM password (required by the image). Not used as CMS login.
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env.compose}
      # Application user created on first start (CMS connect user / schema).
      APP_USER: ${ORACLE_APP_USER:-percuser}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env.compose}
    ports:
      # Host 1521 is often taken by a local Oracle listener; freeport / ORACLE_PORT
      # can reallocate. Cells use container DNS, not this host publish.
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      # healthcheck.sh ships with gvenzl/oracle-xe images.
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  mysql-data:
  postgres-data:
  sqlserver-data:
  oracle-data:
